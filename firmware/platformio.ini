; ==============================================================
; SmartGarden-IoTV2 — PlatformIO Project Configuration
; Board: ESP32 DevKitC (Espressif ESP32)
; ==============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Build settings
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Serial monitor
monitor_speed    = 115200
upload_speed     = 115200
monitor_filters  = esp32_exception_decoder

; Library dependencies (managed by PlatformIO)
lib_deps =
    ; Firebase ESP32 Client
    mobizt/Firebase ESP32 Client @ ^4.4.14

    ; ArduinoJson - used for building/parsing JSON payloads
    bblanchon/ArduinoJson @ ^7.3.1

    ; DHT22
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.15

; Source directory
;src_dir = src

; Upload settings (adjust port if needed)
; upload_port = COM3