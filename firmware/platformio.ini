; ==============================================================
; SmartGarden-IoTV2 — PlatformIO Project Configuration
; Board: ESP32 DevKitC (Espressif ESP32)
; ==============================================================
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
; Build settings
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
; Serial monitor
monitor_speed    = 115200
monitor_filters  = esp32_exception_decoder
; Library dependencies (managed by PlatformIO)
lib_deps =
    ; MQTT client - lightweight, Arduino-compatible
    knolleary/PubSubClient @ ^2.8.0
    ; ArduinoJson - used for building/parsing MQTT payloads
    bblanchon/ArduinoJson @ ^7.3.1
; Source directory
src_dir = src
; Upload settings (adjust port if needed)
; upload_port = COM3
